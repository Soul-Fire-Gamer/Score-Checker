<div class="dashboard-page">

    <!-- STATS -->
    <div class="stats-grid" id="dashboardStats">
        <div class="stat-card"><div class="stat-value" id="totalAverage">0.0%</div><div class="stat-label">Total Average</div></div>
        <div class="stat-card"><div class="stat-value" id="semester1Avg">0.0%</div><div class="stat-label">Semester 1</div></div>
        <div class="stat-card"><div class="stat-value" id="semester2Avg">0.0%</div><div class="stat-label">Semester 2</div></div>
        <div class="stat-card"><div class="stat-value" id="totalSubjects">0</div><div class="stat-label">Subjects</div></div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="dashboard-layout">

        <!-- LEFT: Subject list (view only) -->
        <div class="sidebar-panel">
            <h2>Your Subjects</h2>
            <div id="subjectsList">
                <div class="empty-state">No subjects yet. Add one on the Subjects page.</div>
            </div>
        </div>

        <!-- RIGHT: Subject detail (view only) -->
        <div class="main-panel">
            <div id="subjectDetail">
                <div class="empty-state">
                    <i class="fas fa-hand-pointer"></i>
                    <h2>Select a Subject</h2>
                    <p>Choose a subject from the list to view its quarters, assignments, and scores.</p>
                </div>
            </div>
        </div>

    </div>
</div>
