<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subjects – Academic Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="subjects.css" />
</head>
<body>

    <header class="page-header">
        <div class="header-left">
            <a href="app.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1><i class="fas fa-book"></i> Subjects</h1>
        </div>
        <div class="header-right">
            <span class="user-display" id="userDisplay">User</span>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="subjects-layout">

        <!-- LEFT: Add + list -->
        <aside class="sidebar-panel">
            <h2>Add Subject</h2>
            <div class="input-row">
                <input type="text" id="subjectInput" placeholder="Subject name" />
                <button class="btn" id="addSubjectBtn"><i class="fas fa-plus"></i> Add</button>
            </div>

            <h2>Your Subjects</h2>
            <div class="subjects-list" id="subjectsList">
                <div class="empty-state"><i class="fas fa-book"></i><p>No subjects yet</p></div>
            </div>
        </aside>

        <!-- RIGHT: Detail -->
        <main class="main-panel" id="subjectDetail">
            <div class="empty-state">
                <i class="fas fa-hand-pointer"></i>
                <h2>Select a Subject</h2>
                <p>Choose a subject to add, edit, or manage assignments</p>
            </div>
        </main>
    </div>

    <script src="subjects.js"></script>
</body>
</html>
