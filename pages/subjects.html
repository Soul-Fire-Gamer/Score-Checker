<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Subjects – Academic Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="subjects.css" />
</head>
<body>

    <!-- ===== MAIN LAYOUT ===== -->
    <div class="container">
        <div class="dashboard-layout">
            
            <!-- LEFT SIDEBAR: Subject List -->
            <div class="sidebar-panel">
                <h2>Your Subjects</h2>
                <div class="input-row">
                    <input type="text" id="subjectInput" placeholder="Add a new subject..." />
                    <button class="btn" id="addSubjectBtn"><i class="fas fa-plus"></i></button>
                </div>
                <div class="subjects-list" id="subjectsList">
                    <div class="empty-state"><i class="fas fa-book"></i><p>No subjects yet</p></div>
                </div>
            </div>

            <!-- RIGHT MAIN PANEL: Subject Editor -->
            <div class="main-panel" id="subjectDetail">
                <div class="empty-state">
                    <i class="fas fa-hand-pointer"></i>
                    <h2>Select a Subject to Edit</h2>
                    <p>Choose a subject from the left to manage its quarters, assignments, and final exam.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="subjects.js"></script>
</body>
</html>
