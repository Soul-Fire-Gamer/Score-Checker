<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Subjects – Academic Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="subjects.css" />
</head>
<body>

    <div class="subjects-page">
        <h2><i class="fas fa-book"></i> All Subjects</h2>

        <!-- Empty state (shown when no subjects) -->
        <div id="emptyState" class="empty-state">
            <i class="fas fa-book"></i>
            <p>No subjects yet. Go to Dashboard to add one.</p>
        </div>

        <!-- Subject list -->
        <div id="subjectsList" class="subjects-list"></div>
    </div>

    <!-- ===== EDITOR MODAL ===== -->
    <div class="modal-overlay" id="editorModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModalBtn" aria-label="Close">
                <i class="fas fa-times"></i>
            </button>
            <div id="editorContainer"></div>
        </div>
    </div>

    <script src="subjects.js"></script>
</body>
</html>
