<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Academic Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="login.css" />
</head>
<body>
    <div class="login-card">
        <h1>📚 Academic Tracker</h1>
        <p class="subtitle">Sign in or create an account</p>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <div class="form-section active" id="loginSection">
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required />
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required />
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div id="loginHint" class="hint-text"></div>
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span id="loginBtnText">Login</span>
                </button>
            </form>
            <div id="loginError" class="error-msg"></div>
            <div id="loginSuccess" class="success-msg"></div>
            <div id="loginLoading" class="loading-msg">⏳ Validating…</div>
        </div>

        <!-- Register Form -->
        <div class="form-section" id="registerSection">
            <form id="registerForm" autocomplete="off">
                <div class="input-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username" required />
                </div>
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Choose a password" required />
                    <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="input-group">
                    <label for="regHint">Password Hint (optional)</label>
                    <input type="text" id="regHint" placeholder="e.g., 'My favorite pet'" />
                </div>
                <button type="submit" class="btn-primary" id="registerBtn">
                    <span id="registerBtnText">Create Account</span>
                </button>
            </form>
            <div id="registerError" class="error-msg"></div>
            <div id="registerSuccess" class="success-msg"></div>
            <div id="registerLoading" class="loading-msg">⏳ Creating account…</div>
        </div>

        <div class="footer">
            <p>🔒 Passwords are hashed locally.</p>
            <p style="margin-top:4px;"><a href="#" onclick="alert('Contact your administrator for help.')">Need help?</a></p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
